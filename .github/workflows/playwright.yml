name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

# Deploy
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ==========================================================
  # ✅ JOB 1: RUN TESTS (MATRIX)
  # ==========================================================
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project: [API-testing, ui-chromium]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ✅ Cache Playwright Browsers
      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # ✅ Install browsers only if cache miss
      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.project }} --retries=2
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          UI_BASE_URL: https://automationintesting.online
          API_USERNAME: ${{ secrets.API_USERNAME }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}

      # ✅ Upload Allure Results
      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results
          retention-days: 7

      # ✅ Upload Playwright HTML Report (debugging)
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report

  # ==========================================================
  # ✅ JOB 2: MERGE + GENERATE + DEPLOY REPORT
  # ==========================================================
  deploy-report:
    needs: test
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ✅ Ensure jq exists
      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Download Allure Results
        uses: actions/download-artifact@v4
        with:
          path: combined-results

      - name: List downloaded files
        run: ls -R combined-results || true

      # ✅ Safe merge
      - name: Merge Allure Results
        run: |
          mkdir -p merged-results
          
          for dir in combined-results/allure-results-*; do
            if [ -d "$dir" ]; then
            cp -r $dir/* merged-results/
            fi
          done
      
      - name: Debug merged results
        run: ls -R merged-results
    
      - name: Restore Allure History
        run: |
          if [ -d "gh-pages/history" ]; then
            cp -r gh-pages/history merged-results/history
          fi

      - name: Limit Allure history
        run: |
          for file in history.json duration-trend.json history-trend.json categories-trend.json; do
            if [ -f "merged-results/history/$file" ]; then
              jq '.[-20:]' merged-results/history/$file > tmp.json
              mv tmp.json merged-results/history/$file
            fi
          done

      - name: Generate Allure Report
        run: |
          allure generate merged-results --clean -o allure-report

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
