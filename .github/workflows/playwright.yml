name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ==========================================================
  # ✅ JOB 1: RUN TESTS (MATRIX)
  # ==========================================================
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project: [API-testing, ui-chromium]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.project }}
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          UI_BASE_URL: https://automationintesting.online
          API_USERNAME: ${{ secrets.API_USERNAME }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results
          retention-days: 7

  # ==========================================================
  # ✅ JOB 2: MERGE + GENERATE + DEPLOY REPORT
  # ==========================================================
  deploy-report:
    needs: test
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Download Allure Results
        uses: actions/download-artifact@v4
        with:
          path: combined-results

      - name: List downloaded files
        run: ls -R combined-results || true

      - name: Merge Allure Results
        run: |
          mkdir merged-results
          find combined-results -type f -name '*.json' -exec cp {} merged-results \; || true

      - name: Restore Allure History
        run: |
          if [ -d "gh-pages/history" ]; then
            cp -r gh-pages/history merged-results/history
          fi

      - name: Limit Allure history
        run: |
          for file in history.json duration-trend.json history-trend.json categories-trend.json; do
            if [ -f "merged-results/history/$file" ]; then
              jq '.[-20:]' merged-results/history/$file > tmp.json
              mv tmp.json merged-results/history/$file
            fi
          done

      - name: Generate Allure Report
        run: |
          allure generate merged-results --clean -o allure-report

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
