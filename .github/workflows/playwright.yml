name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ==========================================================
  # ✅ JOB 1: RUN TESTS (MATRIX)
  # ==========================================================
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project: [API-testing, ui-chromium]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.project }} --reporter=dot
        env:
          API_BASE_URL: https://automationintesting.online
          UI_BASE_URL: ${{ secrets.UI_BASE_URL }}
          API_USERNAME: ${{ secrets.API_USERNAME }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}

      # ✅ Upload Allure raw results (VERY IMPORTANT)
      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results
          retention-days: 7

  # ==========================================================
  # ✅ JOB 2: MERGE + GENERATE + DEPLOY REPORT
  # ==========================================================
  deploy-report:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      # ✅ Download ALL artifacts from matrix jobs
      - name: Download Allure Results
        uses: actions/download-artifact@v4
        with:
          path: combined-results

      # ✅ Debug (optional but useful)
      - name: List downloaded files
        run: ls -R combined-results || true

      # ✅ Merge Allure results safely
      - name: Merge Allure Results
        run: |
          mkdir merged-results
          find combined-results -type f -name '*.json' -exec cp {} merged-results \; || true

      # ✅ Generate Allure report
      - name: Generate Allure Report
        run: |
          allure generate merged-results --clean -o allure-report

      # ✅ Upload report once (IMPORTANT)
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      # ✅ Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4